<!DOCTYPE html>
<html>
<head>
    <title>WiFi Configuration</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        :root {
            --accent: #A24BFF;
            --accent-hover: #B76BFF;
            --accent-soft: rgba(162, 75, 255, 0.14);
            --bg-grad-1: #000000;
            --bg-grad-2: #0a0510;
            --surface: #12081f;
            --surface-muted: #1a0f2b;
            --border: rgba(162, 75, 255, 0.14);
            --text: #FFFFFF;
            --text-muted: #8EA1B8;
            --success: #A24BFF;
            --shadow: 0 10px 30px rgba(162, 75, 255, 0.18), 0 2px 6px rgba(0, 0, 0, 0.45);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --accent: #A24BFF;
                --accent-hover: #B76BFF;
                --accent-soft: rgba(162, 75, 255, 0.14);
                --bg-grad-1: #000000;
                --bg-grad-2: #0a0510;
                --surface: #12081f;
                --surface-muted: #1a0f2b;
                --border: rgba(162, 75, 255, 0.14);
                --text: #FFFFFF;
                --text-muted: #8EA1B8;
                --success: #A24BFF;
                --shadow: 0 10px 30px rgba(162, 75, 255, 0.18), 0 2px 6px rgba(0, 0, 0, 0.45);
            }
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(160deg, var(--bg-grad-1), var(--bg-grad-2));
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            max-height: 100vh;
            padding: 24px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 40px 36px;
            max-width: 360px;
            width: 100%;
        }

        .brand {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .checkmark {
            width: 110px;
            height: 110px;
            margin-bottom: 24px;
        }
        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke: var(--success);
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: var(--success);
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        @keyframes stroke {
            to { stroke-dashoffset: 0; }
        }

        .message {
            text-align: center;
        }
        .message .primary {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 6px;
        }
        .message .secondary {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="brand">Hermes Orb</div>
            <svg class="checkmark" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" stroke-width="2"/>
                <path class="checkmark__check" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>

            <div class="message">
                <p class="primary" id="message">Configuration successful!</p>
            </div>
        </div>
    </div>
    
    <script>
        window.addEventListener('load', function() {
            const params = new URLSearchParams(window.location.search);
            const message = params.get('message') || 'Configuration successful!';
            document.title = message;
            document.getElementById('message').textContent = message;

            // Send exit request after a short delay
            setTimeout(function() {
                fetch('/exit', {
                    method: 'POST'
                })
                .then(response => {
                    if (response.ok) {
                        console.log('Exit config mode request sent');
                    } else {
                        console.error('Failed to send exit request');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }, 1000);
        });
    </script>
</body>
</html>
